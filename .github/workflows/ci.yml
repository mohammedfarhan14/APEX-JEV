name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: apex-data ingest --raw data/raw --processed /tmp/processed --reports /tmp/reports --stem ci
      - run: apex-data verify --processed /tmp/processed
